
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>Cezonal UPI Payment</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #f5f6fa;
  font-family: Arial, sans-serif;
}

.payment-box {
  width: min(92%, 380px);
  padding: 25px;
  background: white;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 8px 30px #00000012;
}

h2 { margin-bottom: 5px; }

.amount {
  font-size: 44px;
  font-weight: bold;
  margin: 25px 0;
}

.pay-btn {
  width: 100%;
  padding: 16px;
  border: 0;
  border-radius: 12px;
  margin-bottom: 12px;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.phonepe { background: #5f259f; }
.gpay { background: #202124; }
.paytm { background: #00baf2; }

.note {
  font-size: 12px;
  color: #777;
  line-height: 1.5;
}
</style>
</head>

<body>
<div class="payment-box">

  <h2>Cezonal Solutions</h2>
  <p>Choose your payment app</p>

  <div class="amount">₹20.00</div>

  <button class="pay-btn phonepe"
    onclick="payNow('phonepe')">
    Pay with PhonePe
  </button>

  <button class="pay-btn gpay"
    onclick="payNow('gpay')">
    Pay with Google Pay
  </button>

  <button class="pay-btn paytm"
    onclick="payNow('paytm')">
    Pay with Paytm
  </button>

  <p id="message" class="note">
    Complete payment in your UPI app.
  </p>

</div>

<script>
const upiId = "cezonalsolutionspvtltd@axl";
const merchantName = "Cezonal Solutions Pvt Ltd";
const amount = "20.00";

function payNow(app) {
  const params = new URLSearchParams({
    pa: upiId,
    pn: merchantName,
    am: amount,
    cu: "INR",
    tn: "Cezonal Website Payment"
  });

  const upiQuery = params.toString();
  let paymentUrl;

  if (app === "phonepe") {
    paymentUrl = "phonepe://pay?" + upiQuery;
  } else if (app === "gpay") {
    paymentUrl = "tez://upi/pay?" + upiQuery;
  } else if (app === "paytm") {
    paymentUrl = "paytmmp://pay?" + upiQuery;
  } else {
    return;
  }

  document.getElementById("message").textContent =
    "Opening selected app. If nothing happens, open this page in Chrome or Safari.";

  window.location.href = paymentUrl;
}
</script>
</body>
</html>

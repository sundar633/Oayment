<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UPI Test</title>
</head>

<body style="text-align:center;padding-top:100px;font-family:Arial">

<h2>CEZOO UPI Test</h2>
<h1>₹1.00</h1>

<button onclick="payUPI()"
style="padding:16px 35px;font-size:18px;border:0;border-radius:12px;background:#111;color:#fff">
  Pay with UPI
</button>

<script>
function payUPI() {

  const upiId = "boim-867411230473@boi";
  const name = "VEERABHADRARAO KASAGANI";
  const amount = "1.00";
  const ref = "CEZOO" + Date.now();

  const url =
    "upi://pay" +
    "?pa=" + encodeURIComponent(upiId) +
    "&pn=" + encodeURIComponent(name) +
    "&am=" + encodeURIComponent(amount) +
    "&cu=INR" +
    "&tr=" + encodeURIComponent(ref) +
    "&tn=" + encodeURIComponent("CEZOO Test");

  window.location.href = url;
}
</script>

</body>
</html>

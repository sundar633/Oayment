
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cezonal Solutions Payment</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #f5f6fa;
  font-family: Arial, sans-serif;
}

.payment-box {
  background: white;
  width: min(90%, 360px);
  padding: 28px 22px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.amount {
  font-size: 42px;
  font-weight: 700;
  margin: 24px 0;
}

button {
  width: 100%;
  background: #5f259f;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 16px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
}

p { color: #666; font-size: 13px; }
</style>
</head>
<body>

<div class="payment-box">
  <h2>Cezonal Solutions</h2>
  <p>Secure UPI Payment</p>

  <div class="amount">₹20.00</div>

  <button onclick="payNow()">Pay ₹20</button>

  <p>PhonePe • Google Pay • Paytm</p>
</div>

<script>
function payNow() {
  const params = new URLSearchParams({
    pa: "cezonalsolutionspvtltd@axl",
    pn: "Cezonal Solutions Pvt Ltd",
    am: "20.00",
    cu: "INR",
    tn: "Website Payment"
  });

  window.location.href = "upi://pay?" + params.toString();
}
</script>

</body>
</html>

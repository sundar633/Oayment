<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UPI Test</title>
</head>

<body style="font-family:Arial;text-align:center;padding-top:100px;">

  <h2>UPI Intent Test</h2>
  <p>Amount: ₹1.00</p>

  <button
    onclick="openUPI()"
    style="
      border:0;
      padding:16px 35px;
      border-radius:12px;
      background:#111;
      color:white;
      font-size:18px;
    ">
    Pay ₹1
  </button>

<script>
function openUPI() {

  const upiId = "boim-867411230473@boi";
  const name = "VEERABHADRARAO KASAGANI";
  const amount = "1.00";

  const transactionRef = "TEST" + Date.now();

  const upiURL =
    "upi://pay" +
    "?pa=" + encodeURIComponent(upiId) +
    "&pn=" + encodeURIComponent(name) +
    "&am=" + encodeURIComponent(amount) +
    "&cu=INR" +
    "&tr=" + encodeURIComponent(transactionRef) +
    "&tn=" + encodeURIComponent("UPI Intent Test");

  window.location.href = upiURL;
}
</script>

</body>
</html>
